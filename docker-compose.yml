services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: agentic-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      # Format is NEO4J_AUTH=user/password. Override in .env for anything real.
      - NEO4J_AUTH=neo4j/neo4jpassword
    volumes:
      - neo4j_storage:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agentic-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentic
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: agentic-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the datastores are reachable by service name.
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agentic
    depends_on:
      - qdrant
      - neo4j
      - postgres
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: agentic-web
    ports:
      - "3000:3000"
    # NEXT_PUBLIC_API_BASE is baked at build time and used by the browser,
    # so it points at the host-exposed API port (default http://localhost:8000).
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: agentic-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: agentic-grafana
    ports:
      - "3002:3000"   # 3000 = web UI; 3001 was busy on this host
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_storage:
  postgres_storage:
  grafana_storage:
