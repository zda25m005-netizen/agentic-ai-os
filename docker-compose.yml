services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: agentic-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the vector DB is reachable by service name.
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: agentic-web
    ports:
      - "3000:3000"
    # NEXT_PUBLIC_API_BASE is baked at build time and used by the browser,
    # so it points at the host-exposed API port (default http://localhost:8000).
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
