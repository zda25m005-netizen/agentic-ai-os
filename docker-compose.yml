services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: agentic-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt driver
    environment:
      # Format is NEO4J_AUTH=user/password. Override in .env for anything real.
      - NEO4J_AUTH=neo4j/neo4jpassword
    volumes:
      - neo4j_storage:/data
    restart: unless-stopped

  api:
    build: .
    container_name: agentic-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network the datastores are reachable by service name.
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - qdrant
      - neo4j
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: agentic-web
    ports:
      - "3000:3000"
    # NEXT_PUBLIC_API_BASE is baked at build time and used by the browser,
    # so it points at the host-exposed API port (default http://localhost:8000).
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_storage:
