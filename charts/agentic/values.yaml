# Default values for the agentic-ai-os chart. Override per environment.
image:
  pullPolicy: IfNotPresent

# Run pods as an unprivileged user; drop all Linux capabilities.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Default-deny + least-privilege NetworkPolicies (off in dev, on in prod).
networkPolicy:
  enabled: false

# Non-secret runtime config -> ConfigMap (mounted via envFrom on the API).
config:
  QDRANT_URL: http://qdrant:6333
  NEO4J_URI: bolt://neo4j:7687
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentic
  REDIS_URL: redis://redis:6379/0
  LLM_MODEL: gpt-4o-mini
  APP_ENV: dev
  LOG_LEVEL: INFO

# Secret values -> Secret (empty by default; set via -f prod-values.yaml or --set).
secrets:
  OPENAI_API_KEY: ""
  JWT_SECRET: ""

api:
  image: agentic-ai-os-api:latest
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

web:
  image: agentic-ai-os-web:latest
  replicas: 2
  port: 3000
  apiBase: http://api:8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

datastores:
  qdrant:
    image: qdrant/qdrant:latest
    storage: 5Gi
  neo4j:
    image: neo4j:5-community
    storage: 5Gi
    auth: neo4j/neo4jpassword
  postgres:
    image: postgres:16-alpine
    storage: 5Gi
    user: postgres
    password: postgres
    db: agentic
  redis:
    image: redis:7-alpine

ingress:
  enabled: false
  className: nginx
  host: agentic.local
  annotations: {}

# Horizontal Pod Autoscaler for the API (scales on CPU).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
