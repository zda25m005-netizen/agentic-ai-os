# Grafana dashboard provider — auto-loads every JSON dashboard on startup.
apiVersion: 1

providers:
  - name: agentic
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
